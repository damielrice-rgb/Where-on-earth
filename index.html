<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <script type="module" src="/src/index.ts" defer></script>

  <title>Where in the world?</title>
</head>

<body class="min-h-screen bg-light-background dark:bg-dark-background font-nunito text-light-text transition-colors duration-200">

  <header class="bg-white shadow-sm transistion-colors duration-200 dark:bg-dark-element">
    <div class="mx-auto flex max-w-[1440px] items-center justify-between px-6 py-6 sm:px-10 lg:px-20">

      <h1 class="text-lg font-extrabold text-light-text dark:text-white sm:text-2xl">
        Where in the world?
      </h1>

      <button
        type="button"
        id="theme-toggle"
        class="flex items-center gap-2 text-sm font-semibold text-light-text dark:text-white"
        aria-label="Toggle dark mode"
      >
        <span aria-hidden="true">☾</span>
        Dark Mode
      </button>

    </div>
  </header>

  <main class="mx-auto max-w-[1440px] px-6 py-8 sm:px-10 lg:px-20">

    <section class="mb-10 flex flex-col gap-10 sm:flex-row sm:items-center sm:justify-between">

      <div>
        <label for="search-input" class="sr-only">
          Search for a country
        </label>

        <input
          type="search"
          id="search-input"
          placeholder="Search for a country..."
          class="w-full rounded-md bg-white px-6 py-4 text-sm shadow-sm outline-none placeholder:text-light-input focus:ring-2 focus:ring-light-text sm:w-96"
        />
      </div>

      <div>
        <label for="region-filter" class="sr-only">
          Filter by region
        </label>

        <select
          id="region-filter"
          class="w-full rounded-md bg-white px-5 py-4 text-sm shadow-sm outline-none focus:ring-2 focus:ring-light-text sm:w-52"
        >
          <option value="">Filter by Region</option>
          <option value="Africa">Africa</option>
          <option value="Americas">Americas</option>
          <option value="Asia">Asia</option>
          <option value="Europe">Europe</option>
          <option value="Oceania">Oceania</option>
        </select>
      </div>

    </section>

    <div
      id="countries-grid"
      class="grid grid-cols-1 gap-10 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
    ></div>

    <div id="country-details"></div>

  </main>

</body>
</html>
